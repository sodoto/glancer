# Glancer on its own. If Glance runs from a compose file too, you can instead paste the
# `glancer:` service into that file (see the README) and use `./config:/glance-config`.
services:
  glancer:
    build: https://github.com/sodoto/glancer.git#main
    image: glancer:latest
    container_name: glancer
    restart: unless-stopped
    ports:
      - "8090:8080"  # open http://<this machine's IP>:8090
    volumes:
      # The folder that holds Glance's glance.yml (the same folder Glance mounts as /app/config).
      - /opt/glance/config:/glance-config
      # Glancer's own data: your login and the backups of glance.yml.
      - ./glancer-data:/data
    environment:
      - GLANCER_BACKUPS=30  # how many backups of glance.yml to keep
      # - GLANCE_URL=http://192.168.1.50:8080  # optional: adds an "Open Glance" button
