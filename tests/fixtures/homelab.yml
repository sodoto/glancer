# Top comment: my homelab dashboard
server:
  port: ${PORT}   # env port
  host: "0.0.0.0"

theme:
  # Catppuccin-ish
  background-color: 240 8 9
  presets:
    gruvbox: {background-color: 0 0 16, primary-color: '43 59 81'}

pages:
  - $include: home.yml
  - !include: other.yml

  - name: Homelab
    width: slim
    columns:
      - size: full
        widgets:
          - $include: rss.yml
          - type: group
            define: &shared
              type: reddit
              show-thumbnails: true
            widgets:
              - subreddit: games
                <<: *shared

          - type: bookmarks
            groups:
              - title: "Media"
                color: 10 70 50
                links:
                  - title: Jellyfin
                    url: https://jf.${DOMAIN}/   # comment
                    icon: 'si:jellyfin'

          - type: monitor
            cache: 1m
            sites:
              - title: Immich
                url: https://photos.${DOMAIN}
                alt-status-codes: [401, 403]
              - title: Vault
                url: \${NOT_AN_ENV}

      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday
          # trailing comment of the small column

# end of file
